<header class="header">
  <div class="cont1_header" [class.hide]="isFixed">
    <div class="nav1">
    </div>
  </div>

  <div class="cont2_header" [class.fixed]="isFixed">
    <nav class="nav2">
      <div class="logo">
        <a href="/">
          <img src="/logo_header.png" alt="Dalias" />
        </a>
      </div>

      <ul class="menu">
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#planes">Planes</a></li>
        <li><a href="#instalaciones">Instalaciones</a></li>
        <li><a href="#actividades">Actividades</a></li>
        <li><a href="#propuesta">Propuesta</a></li>
        <li><a href="#testimonios">Testimonios</a></li>
        <li><a href="#contactanos">Contáctanos</a></li>
      </ul>

      <div class="header-actions">
        <a href="https://wa.link/iv575a" target="_blank" rel="noopener noreferrer" class="btn_header">
          <i class="bx bx-phone"></i>
          <div class="contact_header">
            <span>+51 981 776 156</span>
            ¿Alguna duda? Contáctanos
          </div>
        </a>
      </div>

      <button class="btn-hamburguesa" (click)="toggleMenu()" aria-label="Menú">
        <span class="line-ham"></span>
        <span class="line-ham"></span>
        <span class="line-ham"></span>
      </button>
    </nav>
  </div>

  <div class="overlay-menu" [class.activo]="menuAbierto" (click)="cerrarMenu()"></div>

  <aside class="panel-mobile" [class.abierto]="menuAbierto">

    <div class="panel-head">
      <img src="/logo_header.png" alt="Dalias" class="panel-logo" />
      <button class="btn-cerrar" (click)="cerrarMenu()" aria-label="Cerrar menú">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <ul class="menu-mobile">
      <li>
        <a (click)="scrollToSection('nosotros')">
          <i class="fas fa-building"></i> Nosotros
        </a>
      </li>
      <li>
        <a (click)="scrollToSection('servicios')">
          <i class="fas fa-cog"></i> Servicios
        </a>
      </li>
      <li>
        <a (click)="scrollToSection('planes')">
          <i class="fas fa-calendar-alt"></i> Planes
        </a>
      </li>
      <li>
        <a (click)="scrollToSection('instalaciones')">
          <i class="fas fa-briefcase"></i> Instalaciones
        </a>
      </li>
      <li>
        <a (click)="scrollToSection('actividades')">
          <i class="fas fa-dumbbell"></i> Actividades
        </a>
      </li>
      <li>
        <a (click)="scrollToSection('contactanos')">
          <i class="fas fa-envelope"></i> Contáctanos
        </a>
      </li>
    </ul>

    <div class="panel-acciones">
      <a href="https://wa.link/iv575a" target="_blank" rel="noopener noreferrer" class="btn-panel btn-panel-contacto" (click)="cerrarMenu()">
        <i class="bx bx-phone"></i>
        <div>
          <span class="btn-panel-numero">+51 981 776 156</span>
          <span class="btn-panel-sub">¿Alguna duda?</span>
        </div>
      </a>
    </div>
  </aside>
</header>
